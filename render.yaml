# Render tek tık kurulum: https://render.com/deploy?repo=https://github.com/Aexus2/rave
services:
  - type: web
    name: kimse
    runtime: node
    plan: free
    rootDir: kimse
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_KEY
        generateValue: true
  - type: web
    name: reel-indirici
    runtime: python
    plan: free
    rootDir: indirici
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 8
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ACCESS_KEY
        generateValue: true
      - key: IG_COOKIES
        sync: false
