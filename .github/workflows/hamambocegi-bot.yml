name: hamambocegi-bot

on:
  schedule:
    # UTC saat; Türkiye saatiyle 10:00, 15:00, 20:00
    - cron: "0 7,12,17 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Komut"
        type: choice
        default: list
        options: [list, add, dm, approve, reject, caption, retry, post]
      args:
        description: 'Argümanlar (ör: add için  "https://instagram.com/reel/XXX/" --owner kullanici --caption "metin")'
        required: false
        default: ""

concurrency:
  group: bot-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hamambocegi-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hamambocegi-bot/requirements.txt

      - name: Bağımlılıklar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Instagram çerezleri (varsa)
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          if [ -n "$IG_COOKIES" ]; then
            printf '%s' "$IG_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "IG_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Botu çalıştır
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          CMD: ${{ github.event.inputs.command || 'post' }}
          ARGS: ${{ github.event.inputs.args || '--count 1' }}
        run: |
          python - <<'PY'
          import os, shlex, subprocess, sys
          cmd = [sys.executable, "bot.py", os.environ["CMD"], *shlex.split(os.environ["ARGS"])]
          print("$", " ".join(cmd[1:]))
          sys.exit(subprocess.run(cmd).returncode)
          PY

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "hamambocegi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.db
          if ! git diff --cached --quiet; then
            git commit -m "bot: durum güncellendi [skip ci]"
            git pull --rebase -q && git push
          fi
